<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D PNG у 3D Рельєф без рамки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100">

    <div class="absolute top-4 left-4 z-10 bg-slate-800/90 backdrop-blur-md p-5 rounded-2xl shadow-2xl border border-slate-700 max-w-sm w-full">
        <h1 class="text-xl font-bold mb-1 text-indigo-400">3D Рельєф без рамки</h1>
        <p class="text-xs text-slate-400 mb-4">Формати: <span class="font-semibold text-slate-200">.PNG, .JPG, .SVG</span></p>
        
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 rounded-xl p-3 cursor-pointer bg-slate-900/50 transition-all hover:bg-slate-900 mb-4">
            <svg class="w-7 h-7 text-indigo-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <span class="text-xs font-medium text-slate-200">Оберіть або перетягніть файл</span>
            <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.svg" class="hidden">
        </label>

        <div class="mb-4">
            <div class="flex justify-between text-xs mb-1">
                <span class="text-slate-300">Висота рельєфу (З):</span>
                <span id="depthVal" class="text-indigo-400 font-bold">20</span>
            </div>
            <input type="range" id="extrusionDepth" min="2" max="60" value="20" class="w-full accent-indigo-500 cursor-pointer">
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <button id="exportSTL" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                📥 Скачати .STL
            </button>
            <button id="exportGLB" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition-all shadow-lg shadow-emerald-600/30 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                📥 Скачати .GLB
            </button>
        </div>

        <div id="statusMessage" class="text-xs text-slate-400 text-center min-h-[20px]">
            Очікування файлу...
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let currentModel = null;
        let lastFileContent = null;
        let lastFileType = null;

        window.onload = function() {
            initThreeJS();
            setupUI();
            window.addEventListener('resize', onWindowResize, false);
        };

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -200, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(100, -200, 300);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(400, 40, 0x4f46e5, 0x334155);
            grid.position.z = -20;
            grid.rotation.x = Math.PI / 2;
            scene.add(grid);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupUI() {
            const fileInput = document.getElementById('fileInput');
            const depthSlider = document.getElementById('extrusionDepth');
            const depthVal = document.getElementById('depthVal');

            depthSlider.addEventListener('input', function() {
                depthVal.textContent = this.value;
                if (lastFileContent && lastFileType === 'image') {
                    processFile(lastFileContent, lastFileType, parseFloat(this.value));
                }
            });

            fileInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const fileName = file.name.toLowerCase();
                lastFileType = fileName.endsWith('.svg') ? 'svg' : 'image';

                const reader = new FileReader();
                reader.onload = function(e) {
                    lastFileContent = e.target.result;
                    processFile(lastFileContent, lastFileType, parseFloat(depthSlider.value));
                    
                    const status = document.getElementById('statusMessage');
                    status.textContent = `Готово: ${file.name}`;
                    status.className = "text-xs text-emerald-400 text-center min-h-[20px]";
                    
                    document.getElementById('exportSTL').removeAttribute('disabled');
                    document.getElementById('exportGLB').removeAttribute('disabled');
                };

                if (lastFileType === 'svg') {
                    reader.readAsText(file);
                } else {
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById('exportSTL').addEventListener('click', exportToSTL);
            document.getElementById('exportGLB').addEventListener('click', exportToGLB);
        }

        function processFile(content, type, depth) {
            if (currentModel) scene.remove(currentModel);

            if (type === 'svg') {
                const loader = new THREE.SVGLoader();
                const svgData = loader.parse(content);
                const group = new THREE.Group();

                svgData.paths.forEach((path) => {
                    path.toShapes(true).forEach((shape) => {
                        const geom = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: true, bevelSize: 1, bevelThickness: 1 });
                        const mat = new THREE.MeshStandardMaterial({ color: path.colorStyle || 0x6366f1, side: THREE.DoubleSide });
                        group.add(new THREE.Mesh(geom, mat));
                    });
                });
                group.scale.y = -1;
                finishModel(group);
            } else {
                const img = new Image();
                img.src = content;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const width = 100;
                    const height = Math.round(100 * (img.height / img.width));
                    canvas.width = width;
                    canvas.height = height;
                    
                    ctx.drawImage(img, 0, 0, width, height);
                    const imgData = ctx.getImageData(0, 0, width, height).data;

                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];
                    const indices = [];
                    const uvs = [];

                    const scaleX = 200 / width;
                    const scaleY = (200 * (height / width)) / height;

                    // Створюємо вершини лише для пікселів, які не є повністю прозорими або фоновими
                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const i = (y * width + x) * 4;
                            const r = imgData[i];
                            const g = imgData[i + 1];
                            const b = imgData[i + 2];
                            const a = imgData[i + 3];

                            // Відсікаємо прозорі пікселі або дуже темний/білий однорідний фон за потреби
                            let z = 0;
                            if (a > 20) {
                                const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                                z = brightness * depth;
                            } else {
                                z = -9999; // ховаємо пікселі фону
                            }

                            vertices.push((x - width / 2) * scaleX, (y - height / 2) * scaleY, z);
                            uvs.push(x / width, 1 - y / height);
                        }
                    }

                    // Формуємо трикутники сітки, пропускаючи відкинуті вершини
                    for (let y = 0; y < height - 1; y++) {
                        for (let x = 0; x < width - 1; x++) {
                            const a = x + y * width;
                            const b = (x + 1) + y * width;
                            const c = x + (y + 1) * width;
                            const d = (x + 1) + (y + 1) * width;

                            if (vertices[a * 3 + 2] !== -9999 && vertices[b * 3 + 2] !== -9999 && vertices[c * 3 + 2] !== -9999) {
                                indices.push(a, c, b);
                            }
                            if (vertices[b * 3 + 2] !== -9999 && vertices[c * 3 + 2] !== -9999 && vertices[d * 3 + 2] !== -9999) {
                                indices.push(b, c, d);
                            }
                        }
                    }

                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                    geometry.setIndex(indices);
                    geometry.computeVertexNormals();

                    const texture = new THREE.TextureLoader().load(content);
                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        roughness: 0.4,
                        metalness: 0.1,
                        transparent: true
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    finishModel(mesh);
                };
            }
        }

        function finishModel(obj) {
            currentModel = obj;
            const box = new THREE.Box3().setFromObject(currentModel);
            currentModel.position.sub(box.getCenter(new THREE.Vector3()));
            scene.add(currentModel);

            const size = box.getSize(new THREE.Vector3());
            let dist = Math.max(size.x, size.y, size.z) * 2.5;
            camera.position.set(0, -dist * 0.8, dist * 0.6);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function exportToSTL() {
            if (!currentModel) return;
            const result = new THREE.STLExporter().parse(currentModel, { binary: true });
            downloadBlob(new Blob([result], { type: 'application/octet-stream' }), 'model-no-border.stl');
        }

        function exportToGLB() {
            if (!currentModel) return;
            new THREE.GLTFExporter().parse(currentModel, function (gltf) {
                downloadBlob(new Blob([gltf], { type: 'model/gltf-binary' }), 'model-no-border.glb');
            }, { binary: true });
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
